# Relay chain: a deputy downlinks through a co-flying relay to a ground
# station, with the formation's barycenter and Hill-frame relative
# states recorded alongside the two RF links.
#
# `deputy` and `relay` fly in tandem 0.5 degrees of RAAN apart; the
# crosslink tracks their slant range, the downlink (X-band) hands the
# data to Boulder, CO, and the formation block averages the group and
# reports each deputy's offset in the relay's Hill frame.

[simulation]
name = "relay-chain"
duration = 600.0

[world]
central_body = "earth"
epoch = "2026-01-01 00:00:00.0 TDB"

[world.spice]
enabled = true

[[world.gravities]]
name = "earth"
central = true

[[world.gravities]]
name = "sun"

[[spacecraft]]
name = "relay"

[spacecraft.orbit]
type = "elements"
[spacecraft.orbit.elements]
a = 7.0e6
e = 0.0
i = 0.0
raan = 0.0

[[spacecraft]]
name = "deputy"

[spacecraft.orbit]
type = "elements"
[spacecraft.orbit.elements]
a = 7.0e6
e = 0.0
i = 0.0
raan = -0.5

[[comm_links]]
name = "feed"
type = "crosslink"
transmitter = "deputy"
receiver = "relay"

[comm_links.tx_antenna]
frequency = 8.4e9
directivity_db = 25.0

[comm_links.rx_antenna]
frequency = 8.4e9
directivity_db = 25.0

[[comm_links]]
name = "down"
type = "downlink"
transmitter = "relay"

[comm_links.ground_station]
lat = 40.0069       # Boulder, Colorado
long = -105.2649
elevation = 1655.0
min_elevation = 5.0

[comm_links.tx_antenna]
frequency = 8.4e9       # X-band
tx_power = 100.0
directivity_db = 30.0

[comm_links.rx_antenna]
frequency = 8.4e9
directivity_db = 40.0

[[formations]]
name = "chain"
members = ["relay", "deputy"]
relative_to = "relay"
