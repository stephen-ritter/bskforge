# Two-spacecraft formation; both vehicles share one world, per-vehicle
# logging rates, and independent FSW stacks.

[simulation]
name = "Two-sat formation"
duration = 1800.0

[simulation.dt]
dynamics = 0.1
fsw = 1.0

[world]
central_body = "earth"

# --- Chief ---

[[spacecraft]]
name = "chief"

[spacecraft.hub]
mass = 750.0
[spacecraft.hub.inertia]
ixx = 900.0
iyy = 800.0
izz = 600.0

[spacecraft.orbit]
type = "elements"
[spacecraft.orbit.elements]
a = 7000e3
e = 0.0001
i = 33.3
raan = 48.2
omega = 347.8
trueAnomaly = 85.3

[spacecraft.attitude.initial]
sigma_BN = [0.05, 0.05, -0.05]
omega_BN_B = [0.001, -0.001, 0.001]

[[spacecraft.effectors]]
type = "reactionWheels"
inertia = 0.01
[[spacecraft.effectors.wheels]]
direction_B = [1, 0, 0]
[[spacecraft.effectors.wheels]]
direction_B = [0, 1, 0]
[[spacecraft.effectors.wheels]]
direction_B = [0, 0, 1]

[spacecraft.fsw.guidance]
type = "inertial3D"

[spacecraft.fsw.estimator]
type = "simpleNav"

[spacecraft.fsw.control]
type = "mrpFeedback"
k = 3.5
p = 30.0

[spacecraft.fsw.allocation]
type = "rwMotorTorque"

[spacecraft.logging.state]
sample_time = 0.5

# --- Deputy ---

[[spacecraft]]
name = "deputy"

[spacecraft.hub]
mass = 500.0
[spacecraft.hub.inertia]
ixx = 400.0
iyy = 350.0
izz = 300.0

[spacecraft.orbit]
type = "elements"
[spacecraft.orbit.elements]
a = 7000.5e3
e = 0.0001
i = 33.3
raan = 48.2
omega = 347.8
trueAnomaly = 85.5

[spacecraft.attitude.initial]
sigma_BN = [-0.1, 0.15, 0.05]
omega_BN_B = [-0.002, 0.01, -0.005]

[[spacecraft.effectors]]
type = "reactionWheels"
inertia = 0.008
[[spacecraft.effectors.wheels]]
direction_B = [1, 0, 0]
[[spacecraft.effectors.wheels]]
direction_B = [0, 1, 0]
[[spacecraft.effectors.wheels]]
direction_B = [0, 0, 1]

[spacecraft.fsw.guidance]
type = "inertial3D"
sigma_R0N = [0.1, 0.0, 0.0]

[spacecraft.fsw.estimator]
type = "simpleNav"

[spacecraft.fsw.control]
type = "mrpFeedback"
k = 2.0
p = 25.0

[spacecraft.fsw.allocation]
type = "rwMotorTorque"

[spacecraft.logging.state]
sample_time = 1.0

[logging]
default_num_points = 500
