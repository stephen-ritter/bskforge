# Single spacecraft with an attitude-determination sensor suite.
# CSS x4 + star tracker + IMU, all recorded. Magnetometer/camera arrive
# with the Phase-2/3 environment and imaging builders.

[simulation]
name = "LEO with sensors"
duration = 300.0

[simulation.dt]
dynamics = 0.1
fsw = 1.0

[world]
central_body = "earth"
# Fixed sun along +X for the coarse sun sensors (SPICE in Phase 2).
[world.sun]
position = [1.496e11, 0.0, 0.0]

[[spacecraft]]
name = "sc1"

[spacecraft.hub]
mass = 750.0
[spacecraft.hub.inertia]
ixx = 900.0
iyy = 800.0
izz = 600.0

[spacecraft.orbit]
type = "elements"
[spacecraft.orbit.elements]
a = 7000e3
e = 0.001
i = 28.5

[[spacecraft.effectors]]
type = "reactionWheels"
inertia = 0.01
[[spacecraft.effectors.wheels]]
direction_B = [1, 0, 0]
[[spacecraft.effectors.wheels]]
direction_B = [0, 1, 0]
[[spacecraft.effectors.wheels]]
direction_B = [0, 0, 1]

# --- Sensor suite ---

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css1"
boresight_B = [1, 0, 0]
fov_deg = 40.0
noise_sigma = 0.005

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css2"
boresight_B = [-1, 0, 0]
fov_deg = 40.0

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css3"
boresight_B = [0, 1, 0]
fov_deg = 40.0

[[spacecraft.sensors]]
type = "coarseSunSensor"
name = "css4"
boresight_B = [0, -1, 0]
fov_deg = 40.0

[[spacecraft.sensors]]
type = "starTracker"
name = "st"
sigma_SB = [0, 0, 0]

[[spacecraft.sensors]]
type = "imuSensor"
name = "imu"
sigma_PB = [0, 0, 0]

[spacecraft.fsw.guidance]
type = "inertial3D"

[spacecraft.fsw.estimator]
type = "simpleNav"

[spacecraft.fsw.control]
type = "mrpFeedback"
k = 3.5
p = 30.0

[spacecraft.fsw.allocation]
type = "rwMotorTorque"

[spacecraft.logging.state]
sample_time = 0.5
