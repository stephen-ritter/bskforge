# Two spacecraft, two guidance laws, two control laws.
#
# `chaser` steers its velocity vector with velocityPoint and flies the
# full steering chain (mrpSteering -> rateServoFullNonlinear); `tumor`
# holds the LVLH frame with hillPoint through the classic mrpPD.

[simulation]
name = "guidance-laws"
duration = 600.0

[[spacecraft]]
name = "chaser"

[spacecraft.orbit]
type = "elements"
[spacecraft.orbit.elements]
a = 7.2e6
e = 0.0
i = 0.0

[spacecraft.fsw.control]
type = "rateServo"
max_rate = 0.05

[spacecraft.fsw.guidance]
type = "velocityPoint"

[[spacecraft.effectors]]
type = "reactionWheels"
inertia = 0.05

[[spacecraft.effectors.wheels]]
direction_B = [1.0, 0.0, 0.0]
max_torque = 0.5

[[spacecraft.effectors.wheels]]
direction_B = [0.0, 1.0, 0.0]
max_torque = 0.5

[[spacecraft.effectors.wheels]]
direction_B = [0.0, 0.0, 1.0]
max_torque = 0.5

[[spacecraft]]
name = "tumor"

[spacecraft.orbit]
type = "elements"
[spacecraft.orbit.elements]
a = 7.2e6
e = 0.0
i = 0.0

[spacecraft.fsw.control]
type = "mrpPD"

[spacecraft.fsw.guidance]
type = "hillPoint"

[[spacecraft.effectors]]
type = "reactionWheels"
inertia = 0.05

[[spacecraft.effectors.wheels]]
direction_B = [1.0, 0.0, 0.0]
max_torque = 0.5

[[spacecraft.effectors.wheels]]
direction_B = [0.0, 1.0, 0.0]
max_torque = 0.5

[[spacecraft.effectors.wheels]]
direction_B = [0.0, 0.0, 1.0]
max_torque = 0.5
