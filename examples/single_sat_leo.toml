# Single-spacecraft LEO attitude control, bskforge schema v2.
# Mirrors Basilisk scenarioAttitudeFeedbackRW.py.

[simulation]
name = "LEO detumble"
duration = 600.0

[simulation.dt]
dynamics = 0.1
fsw = 1.0

[world]
central_body = "earth"

[[spacecraft]]
name = "sc1"

[spacecraft.hub]
mass = 750.0

[spacecraft.hub.inertia]
ixx = 900.0
iyy = 800.0
izz = 600.0

[spacecraft.orbit]
type = "elements"

[spacecraft.orbit.elements]
a = 1.0e7
e = 0.01
i = 33.3
raan = 48.2
omega = 347.8
trueAnomaly = 85.3

[spacecraft.attitude.initial]
sigma_BN = [0.1, 0.2, -0.3]
omega_BN_B = [0.001, -0.01, 0.03]

[[spacecraft.effectors]]
type = "reactionWheels"
inertia = 0.01

[[spacecraft.effectors.wheels]]
direction_B = [1, 0, 0]

[[spacecraft.effectors.wheels]]
direction_B = [0, 1, 0]

[[spacecraft.effectors.wheels]]
direction_B = [0, 0, 1]

[spacecraft.fsw.guidance]
type = "inertial3D"
sigma_R0N = [0.0, 0.0, 0.0]

[spacecraft.fsw.estimator]
type = "simpleNav"

[spacecraft.fsw.control]
type = "mrpFeedback"
k = 3.5
p = 30.0
ki = -1.0

[spacecraft.fsw.allocation]
type = "rwMotorTorque"

[spacecraft.logging.state]
sample_time = 0.5

[spacecraft.logging.control_torque]
sample_time = 0.5

[logging]
# directory = "output/leo_detumble"   # uncomment to export CSV automatically

# [visualization]
# enabled = true
# live_stream = true
